name: Build Android APK

# Builds a debug Android APK from the web app (index.html) using Capacitor.
# The APK is uploaded as a workflow artifact you can download from the Actions tab.
#
# Trigger: push to main/master, or manually from the Actions tab (Run workflow).

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java (JDK 17 for Gradle 8 / AGP 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Bundle the web app into www/
        run: python3 build.py --deploy --out www/index.html

      - name: Copy config.js and icons into www/
        run: |
          cp config.js www/config.js
          mkdir -p www/icons
          cp icons/*.png www/icons/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Replace Android launcher icons with the app icon
        run: |
          # Copy our generated ic_launcher / ic_launcher_round into every density bucket,
          # overwriting Capacitor's default green icon so the heart shows on the phone.
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            if [ -f "android-icons/app/src/main/res/$d/ic_launcher.png" ]; then
              cp "android-icons/app/src/main/res/$d/ic_launcher.png"      "android/app/src/main/res/$d/ic_launcher.png"
              cp "android-icons/app/src/main/res/$d/ic_launcher_round.png" "android/app/src/main/res/$d/ic_launcher_round.png"
            fi
          done

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: all-documents-reader-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
