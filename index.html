:root{--surface-2:#FFFFFF;--surface-1:#F6F3EC;--muted:#EDE8DC;--text-primary:#1C1B18;--text-secondary:#5A564B;--text-muted:#6B665A;--border:#DAD3C3;--border-strong:#C8C0AE;--bg-accent:#E1EDE9;--text-accent:#1B5E52;--brand:#1B5E52;--on-brand:#FFFFFF;--dan:#A94A25;--on-dan:#FFFFFF;--bg-pro:#F4E4DB;--text-pro:#A94A25;--bg-warning:#F4E9D6;--text-warning:#8F5A0A;--bg-danger:#F6E3E1;--text-danger:#B3261E;--bg-success:#E1EFE6;--text-success:#2B7A4B;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--surface-2:#1C1B17;--surface-1:#14130F;--muted:#26241F;--text-primary:#ECE8DE;--text-secondary:#B3AE9F;--text-muted:#9A9586;--border:#37342C;--border-strong:#4A463B;--bg-accent:#1E2F2B;--text-accent:#7CCBB8;--brand:#7CCBB8;--on-brand:#0E2A24;--dan:#EE9468;--on-dan:#2A1206;--bg-pro:#3A2418;--text-pro:#EE9468;--bg-warning:#33291A;--text-warning:#E3B36B;--bg-danger:#3A2220;--text-danger:#F2A19B;--bg-success:#1F2E25;--text-success:#8BD0A6;}}
:root[data-theme="dark"]{--surface-2:#1C1B17;--surface-1:#14130F;--muted:#26241F;--text-primary:#ECE8DE;--text-secondary:#B3AE9F;--text-muted:#9A9586;--border:#37342C;--border-strong:#4A463B;--bg-accent:#1E2F2B;--text-accent:#7CCBB8;--brand:#7CCBB8;--on-brand:#0E2A24;--dan:#EE9468;--on-dan:#2A1206;--bg-pro:#3A2418;--text-pro:#EE9468;--bg-warning:#33291A;--text-warning:#E3B36B;--bg-danger:#3A2220;--text-danger:#F2A19B;--bg-success:#1F2E25;--text-success:#8BD0A6;}
html,body{margin:0;background:var(--surface-1);}
body{--font-body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;--font-display:"Playfair Display",Georgia,serif;font-family:var(--font-body);font-size:14px;color:var(--text-primary);}
input,button,textarea{font:inherit;font-size:15px;border:1px solid var(--border-strong);border-radius:16px;padding:0 16px;min-height:48px;background:var(--surface-2);color:var(--text-primary);}
textarea{padding:12px 16px;}
input[type=text]{width:100%;}
button{cursor:pointer;font-weight:500;border-radius:999px;border-color:transparent;background:var(--brand);color:var(--on-brand);padding:0 20px;}
button:not(:only-child):first-child{background:var(--surface-2);color:var(--text-primary);border-color:var(--border-strong);}
button:disabled{opacity:0.5;cursor:default;}
#phone{position:relative;width:100%;max-width:430px;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));margin:0 auto;background:var(--surface-2);overflow:hidden;display:flex;flex-direction:column;color:var(--text-primary);-webkit-touch-callout:none;}
@media (min-width:481px){#phone{height:min(calc(100vh - 32px),820px);height:min(calc(100dvh - 32px),820px);margin:16px auto;border-radius:24px;border:0.5px solid var(--border-strong);}}
#phone input,#phone textarea{color:var(--text-primary);}
#phone input::placeholder{color:var(--text-muted);}
#phone.f-light{color-scheme:light;--surface-2:#FFFFFF;--surface-1:#F6F3EC;--muted:#EDE8DC;--text-primary:#1C1B18;--text-secondary:#5A564B;--text-muted:#6B665A;--border:#DAD3C3;--border-strong:#C8C0AE;--bg-accent:#E1EDE9;--text-accent:#1B5E52;--brand:#1B5E52;--on-brand:#FFFFFF;--dan:#A94A25;--on-dan:#FFFFFF;--bg-pro:#F4E4DB;--text-pro:#A94A25;--bg-warning:#F4E9D6;--text-warning:#8F5A0A;--bg-danger:#F6E3E1;--text-danger:#B3261E;--bg-success:#E1EFE6;--text-success:#2B7A4B;}
#phone.f-dark{color-scheme:dark;--surface-2:#1C1B17;--surface-1:#14130F;--muted:#26241F;--text-primary:#ECE8DE;--text-secondary:#B3AE9F;--text-muted:#9A9586;--border:#37342C;--border-strong:#4A463B;--bg-accent:#1E2F2B;--text-accent:#7CCBB8;--brand:#7CCBB8;--on-brand:#0E2A24;--dan:#EE9468;--on-dan:#2A1206;--bg-pro:#3A2418;--text-pro:#EE9468;--bg-warning:#33291A;--text-warning:#E3B36B;--bg-danger:#3A2220;--text-danger:#F2A19B;--bg-success:#1F2E25;--text-success:#8BD0A6;}


#phone.dark{color-scheme:dark;background-color:var(--surface-1);}
#phone.dark .sheetpanel,#phone.dark .stick,#phone.dark .dsheet{background:var(--surface-2)!important;}
#phone.dark .ibox{background:var(--muted)!important;}
#body{user-select:none;-webkit-user-select:none;}
.hw{position:absolute;width:0;height:0;pointer-events:none;z-index:9;}
.hw i{position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:50%;border:2px solid var(--text-accent);opacity:0;animation:wave 1.2s ease-out infinite;}
.hw i:nth-child(2){animation-delay:0.4s;}
.hw i:nth-child(3){animation-delay:0.8s;}
.hw b{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;background:#4DA3FF;opacity:0.6;box-shadow:0 0 26px 8px rgba(77,163,255,0.75);transform:scale(0.2);animation-name:core;animation-timing-function:linear;animation-fill-mode:forwards;}
@keyframes wave{0%{transform:scale(0.15);opacity:0.95;}100%{transform:scale(1);opacity:0;}}
@keyframes core{to{transform:scale(1);}}
.sc,.ac{display:inline-block;padding:6px 10px;border-radius:999px;font-size:12px;cursor:pointer;margin:6px 6px 0 0;border:0.5px solid var(--text-accent);color:var(--text-accent);}
.ac{background:var(--bg-accent);}
.sg{flex-shrink:0;padding:8px 12px;border-radius:999px;font-size:12px;cursor:pointer;border:0.5px solid var(--border-strong);color:var(--text-secondary);white-space:nowrap;}
@keyframes dot{0%,80%,100%{opacity:0.25;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}
.dt{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--text-secondary);margin:0 2px;animation:dot 1s infinite;}
.dt:nth-child(2){animation-delay:0.15s;}
.dt:nth-child(3){animation-delay:0.3s;}
.sil{fill:#0A0F1E;stroke:rgba(140,190,255,0.42);stroke-width:0.8;}
.silw{fill:#0A0E1C;stroke:rgba(242,182,109,0.5);stroke-width:0.8;}
.furn{fill:#10162A;stroke:rgba(140,190,255,0.25);stroke-width:0.8;}
.hp{fill:#141A33;stroke:#7FD0FF;stroke-opacity:0.7;stroke-width:1;}
.hpl{fill:none;stroke:#7FD0FF;stroke-opacity:0.7;}
@keyframes hideA{from{opacity:1;}to{opacity:0;}}
@keyframes showA{from{opacity:0;}to{opacity:1;}}
@keyframes cap{0%{opacity:0;}20%{opacity:1;}80%{opacity:1;}100%{opacity:0;}}
@keyframes lid1{from{transform:rotate(0deg);}to{transform:rotate(108deg);}}

@keyframes pulse{from{transform:scale(1);}to{transform:scale(1.05);}}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes suck{0%{transform:rotate(var(--a)) translateX(110px) scale(1);opacity:0;}15%{opacity:1;}100%{transform:rotate(var(--a)) translateX(6px) scale(0.2);opacity:0;}}
@keyframes flash1{0%{opacity:0;}45%{opacity:1;}100%{opacity:0;}}

{label:'Topic 1',blocks:[['h','1. What is a problem?'],['p','A problem is a gap between where you are and where you want to be. Solving it means finding a reliable path across that gap.'],['d','Problem','a gap between the current situation and the goal you want to reach'],['d','Constraint','a rule or limit that any solution must respect'],['k',['problem','goal','constraint','input','output']],['r','Remember: a problem must be stated clearly before it can be solved.'],['a','Class activity: Write down one everyday problem and list its inputs, outputs and constraints.'],['q','What three things should you list when you state a problem?','Inputs, outputs and constraints.'],['q','Why must a problem be stated clearly?','Because a solution cannot be planned until the goal is clear.']]},
{label:'Topic 2',blocks:[['h','2. Understanding the problem'],['p','Before writing any code, state the problem in your own words. List the inputs you are given and the output you must produce.'],['d','Input','the data or information a solution receives at the start'],['d','Output','the result a solution must produce at the end'],['n','Read the problem carefully'],['n','Identify the inputs and outputs'],['n','Note the constraints'],['n','Restate the problem in your own words'],['k',['input','output','requirement','restate']],['r','Important: never start coding before you understand the output you need.'],['a','Class activity: Restate the average of three scores problem in your own words.'],['q','What do inputs and outputs describe?','Inputs are what you start with; outputs are what you must deliver.']]},
{label:'Topic 3',blocks:[['h','3. Planning with algorithms'],['p','A good algorithm is unambiguous, finite and effective. Each step must be clear, and the list of steps must end.'],['d','Algorithm','a finite list of clear steps that solves a problem'],['d','Pseudocode','a plain-language outline of a program written before the real code'],['d','Flowchart','a diagram that shows the steps of a process using boxes and arrows'],['n','Write the steps in plain language'],['n','Check the steps with a small example'],['n','Look for steps that repeat'],['n','Rewrite the steps as pseudocode'],['k',['algorithm','pseudocode','flowchart','step','finite']],['r','Remember: every algorithm must come to an end.'],['a','Class activity: Draw a flowchart for making a cup of tea.'],['q','Name three qualities of a good algorithm.','Unambiguous, finite and effective.'],['q','What is pseudocode used for?','Outlining a program in plain language before writing real code.']]},

f2:{noun:'section',units:[{"label":"Section 1","blocks":[["h","1. Introduction"],["p","I was asked to design a simple solution for sorting a list of student scores from highest to lowest. The list can be empty, and scores can repeat. This report explains how I understood the task, the approach I chose, how I tested it and what I would improve next."],["p","The work was done as part of the Problem Solving course. I followed the four steps taught in class: understand the problem, plan the solution, carry out the plan and check the result. Each part of this report matches one of those steps, so the reader can follow my thinking from the first idea to the final test."]]},{"label":"Section 2","blocks":[["h","2. The problem"],["p","Teachers often need to see which students scored highest. A hand-written list is slow to sort and easy to get wrong, especially when there are many scores. The goal is a short procedure that takes any list of scores and returns the same scores in order from highest to lowest."],["p","The input is a list of whole numbers between 0 and 100. The output is the same list in descending order. If two students have the same score, both scores must appear in the result. If the list is empty, the output is also an empty list and the program must not stop with an error."],["l","Input: a list of whole numbers from 0 to 100"],["l","Output: the same numbers, highest first"],["l","Rule: repeated scores are kept, nothing is removed"],["l","Rule: an empty list gives an empty list"]]},{"label":"Section 3","blocks":[["h","3. Requirements"],["p","Before planning, I wrote down what the solution must do and what it is allowed to assume. Listing the requirements first stopped me from adding features nobody asked for, and it gave me a clear checklist to test against at the end."],["l","The solution must work for lists of any length"],["l","The original list must not be damaged while sorting"],["l","The result must be easy for a teacher to read"],["l","The steps must be simple enough to explain in class"],["p","I decided not to handle names, only scores. Pairing scores with names is a natural extension, but it would have made the first version harder to test."]]},{"label":"Section 4","blocks":[["h","4. My approach"],["p","I split the task into three parts so that each part can be tested on its own. Small parts are easier to fix than one large block, and when a test fails I know straight away which part to look at."],["l","Read the scores into a list"],["l","Compare neighbouring scores and swap them when needed"],["l","Print the sorted list"],["p","For the comparing part I chose a simple method: walk through the list, compare each score with the one next to it and swap the pair when the left score is smaller. After one full walk the smallest score has moved to the end. I repeat the walk until no swaps are needed."]]},{"label":"Section 5","blocks":[["h","5. Choosing a method"],["p","There are many ways to sort a list. I compared three that I already knew: repeatedly swapping neighbours, picking the largest remaining score each time, and splitting the list into halves before joining them in order. The first two are easy to write and explain. The third is faster for long lists but harder to follow."],["p","Because the class lists are short, clarity mattered more to me than speed. I picked the swapping method for the first version and kept the halving method in mind for later, in case the lists became much longer than expected."]]},{"label":"Section 6","blocks":[["h","6. How the steps work"],["p","A walk through the list starts at the first score. I compare it with the second score. If the first is smaller, I swap them. Then I move one place along and compare the new pair. When I reach the end of the list, one walk is complete."],["p","After the first walk, the smallest score is in the last place and does not need to be touched again. After the second walk, the second smallest is in place, and so on. For a list of five scores, at most four walks are needed. I also stop early when a full walk makes no swaps, because that means the list is already in order."],["p","I traced the steps by hand on the list 70, 85, 85, 60, 90 to be sure the idea worked before writing anything down as final."]]},{"label":"Section 7","blocks":[["h","7. Test plan"],["p","Good tests include ordinary cases and awkward ones. I chose four cases, each aimed at a different risk. The order I tested them in was from simplest to hardest, so a failure would point to the smallest possible cause."],["l","Typical input: five different scores in random order"],["l","Empty list: no scores at all"],["l","Repeated scores: the same score appearing several times"],["l","Very large list: one thousand scores"],["p","For every test I wrote down the expected result first, then ran the steps, then compared the two. Writing the expected result in advance stops me from fooling myself after seeing the answer."]]},{"label":"Section 8","blocks":[["h","8. Test results"],["l","Typical input: Pass"],["l","Empty list: Pass"],["l","Repeated scores: Pass"],["l","Very large list: Needs work"],["p","The first three tests gave exactly the expected output. The large list also produced the correct order, but it took much longer than I was comfortable with. A teacher waiting several seconds for a result would probably lose patience, so I marked this test as needing work rather than a pass."]]},{"label":"Section 9","blocks":[["h","9. Problems I met"],["p","My first version crashed on the empty list because it tried to read the first score before checking that one existed. Adding a check at the start fixed it. This taught me to test the empty case early instead of assuming it would be fine."],["p","I also forgot to stop early when no swaps were made, so the steps kept walking through a list that was already sorted. Adding a simple note of whether any swap happened in the current walk removed the waste."]]},{"label":"Section 10","blocks":[["h","10. Performance"],["p","The swapping method compares many pairs. When the list doubles in length, the work grows roughly four times. That is fine for thirty scores but poor for a thousand. This explains why the large test felt slow, and it shows that the result is correct but not yet efficient."],["p","Splitting the list into halves, sorting each half and joining them in order does far less work on long lists. I have not built it yet, but the idea fits the same three parts, so only the middle part would change."]]},{"label":"Section 11","blocks":[["h","11. Next steps"],["p","The last test is slow, so I will look for a faster way to compare scores and then repeat all four tests. I also want to add a fifth test with scores that are already in perfect order, and a sixth with scores in exactly reverse order, since both are common in real class lists."],["l","Replace the compare-and-swap part with a faster method"],["l","Repeat all four tests, then add the two new ones"],["l","Pair each score with a student name"],["l","Show the top three students at the top of the list"]]},{"label":"Section 12","blocks":[["h","12. Conclusion"],["p","The solution sorts typical, empty and repeated lists correctly. Its weakness is speed on very long lists, which I understand and have a plan to fix. Working in small parts made testing easier and made every mistake simple to locate."],["p","The most useful lesson was to write the requirements and the expected test results before building anything. It saved time, and it made this report easy to write, because the thinking was already on paper."]]}]},
